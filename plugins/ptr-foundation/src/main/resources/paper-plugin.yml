name: SMPCreationKit
version: '${version}'
main: fr.smp.ptr.foundation.PtrFoundationPlugin
api-version: '1.21'
description: 'SMP Creation Kit — clean Folia base for future PTR creation plugins.'
website: 'https://github.com/gtolontop/smp-network'
authors: ['SMP Team']
folia-supported: true
load: STARTUP

permissions:
  ptr.cmd.use:
    description: 'Use /ptrf at all.'
    default: op
  ptr.cmd.reload:
    description: 'Reload SMP Creation Kit config.'
    default: op
  ptr.cmd.registry:
    description: 'Inspect SMP Creation Kit registries.'
    default: op
  ptr.cmd.debug:
    description: 'Inspect runtime state (PDC, region).'
    default: op
