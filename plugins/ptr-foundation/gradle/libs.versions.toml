[versions]
# Paper / Folia stack — both MC 26.1.2.
# paperweight-userdev gives us Mojang-mapped NMS via the Paper dev bundle.
# Compile + runtime target Java 25 (the only JDK Paper 26.1.2 publishes for).
paper = "26.1.2.build.7-alpha"
# Folia API is sourced explicitly so RegionScheduler / GlobalRegionScheduler
# and friends survive the JavaCompile phase. Paper ships shims of these so the
# plugin still builds against the Paper dev bundle, but adding folia-api keeps
# us honest if Paper ever drops the shim.
folia = "26.1.2.build.8-stable"

# Build plugins
paperweight = "2.0.0-beta.21"
shadow = "9.2.2"
spotless = "8.0.0"

# Runtime libraries (shaded)
configurate = "4.2.0"
hikari = "5.1.0"
flyway = "11.0.1"
sqlite = "3.47.1.0"

# Test
junit = "5.11.4"
assertj = "3.27.2"
mockito = "5.14.2"

[libraries]
paper-api = { group = "io.papermc.paper", name = "paper-api", version = { strictly = "26.1.2.build.7-alpha-SNAPSHOT" } }
folia-api = { group = "dev.folia", name = "folia-api", version.ref = "folia" }
configurate-yaml = { group = "org.spongepowered", name = "configurate-yaml", version.ref = "configurate" }
hikari = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
sqlite = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
assertj = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }

[bundles]
test = ["junit-jupiter", "assertj", "mockito", "mockito-junit"]

[plugins]
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
