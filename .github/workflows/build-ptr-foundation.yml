name: build-smp-creation-kit

on:
  push:
    branches: [feat/ptr-v3-folia-foundation, master]
    paths:
      - 'plugins/ptr-foundation/**'
      - '.github/workflows/build-ptr-foundation.yml'
  pull_request:
    paths:
      - 'plugins/ptr-foundation/**'
      - '.github/workflows/build-ptr-foundation.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: plugins/ptr-foundation
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (with 21 fallback)
        uses: actions/setup-java@v4
        with:
          # paperweight-userdev 2.0.0-beta.21 has been verified on JDK 25 by the
          # other plugins in this repo. Fall back to 21 only if a Gradle plugin
          # used here grows a hard JDK 25 incompatibility.
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ptr-foundation-${{ runner.os }}-${{ hashFiles('plugins/ptr-foundation/gradle/libs.versions.toml', 'plugins/ptr-foundation/build.gradle.kts', 'plugins/ptr-foundation/settings.gradle.kts') }}
          restore-keys: gradle-ptr-foundation-${{ runner.os }}-

      - name: Gradle wrapper sanity
        run: ./gradlew --version

      - name: Build (compile + test + checkstyle)
        # spotlessCheck deferred until google-java-format ships JDK 25
        # support — see plugins/ptr-foundation/build.gradle.kts for context.
        run: ./gradlew build checkstyleMain test --stacktrace

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SMPCreationKit
          path: plugins/ptr-foundation/build/libs/*.jar
          retention-days: 14
